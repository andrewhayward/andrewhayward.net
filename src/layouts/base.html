<!DOCTYPE html>
<html lang="{{ meta.lang }}" data-content-type="{{ layout | replace(r/\.[^.]*$/, "") }}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="canonical" href="{{ meta.url }}{{ page.url }}" />
        <link rel="me" href="https://bsky.app/profile/andrewhayward.net" />
        <link rel="me" href="https://github.com/andrewhayward" />
        <link rel="me" href="https://linkedin.com/in/arhayward" />
        <link rel="webmention" href="https://webmention.io/andrewhayward.net/webmention" />
        <title>{% if not posttitle %}{% if title %}{{ title | markdown | striptags }} | {% endif %}{% endif %}{{ meta.title }}{% if posttitle %}{% if title %} – {{ title | markdown | striptags }}{% endif %}{% endif %}</title>
        {% if lede %}<meta name="description" content="{{ lede | markdown | striptags }}" />{% endif %}
        {% if eleventy.env.runMode === "build" -%}
            <script defer src="https://cloud.umami.is/script.js" data-website-id="4435fae5-ec9b-4979-9899-f54eed2057e2"></script>
        {%- endif %}
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="en_GB" />
        <meta property="og:url" content="{{ meta.url }}{{ page.url }}" />
        <meta property="og:site_name" content="{{ meta.title }}" />
        <meta property="og:title" content="{{ title | markdown | striptags }}" />
        {% if lede -%}
            <meta property="og:description" content="{{ lede | markdown | striptags | truncate(125) }}" />
        {%- endif %}
        <meta property="og:image" content="/assets/images/og/{{ urlSlug | default(page.fileSlug, true) | default('home', true) }}.webp" />
        <meta property="og:image:alt" content="{{ title | markdown | striptags }}{% if lede %} {{ lede | markdown | striptags }}{% endif %}" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image">
        <script>
            const STATE_KEY = 'settings-state';
            function getSettingsState() {
                try {
                    return JSON.parse(localStorage.getItem(STATE_KEY)) ?? {};
                } catch {
                    return {};
                }
            }
            function setSettingsState(data) {
                localStorage.setItem(STATE_KEY, JSON.stringify(data));
                const html = document.querySelector('html');
                Object.entries(data).forEach(([key, value]) => {
                    const attribute = `data-settings-${key}`;
                    if (value) {
                        html.setAttribute(attribute, value);
                    } else {
                        html.removeAttribute(attribute)
                    }
                });
            }
            setSettingsState(getSettingsState());
        </script>
        <link rel="stylesheet" href="/assets/fonts.css">
        <link rel="stylesheet" href="/assets/style.css">
    </head>
    <body>
        <a href="#main-content" class="skip-link">Skip to main content</a>
        
        {% include "header.html" %}
        <main id="main-content" tabindex="-1">
            {{ content | safe }}
        </main>
        {% include "footer.html" %}
    </body>
</html>
